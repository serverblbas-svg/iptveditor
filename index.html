<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تەلەفزیۆنی ئۆنلاین - IPTV Player</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ستونی لیستی کەناڵەکان */
        .channels-sidebar {
            width: 320px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ستونی لیستی گرووپەکان */
        .groups-sidebar {
            width: 260px;
            background: #0f172a;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            padding: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .sidebar-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* سکڕۆڵبار */
        .sidebar-list::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar-list::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }

        .item-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .groups-sidebar .item-card {
            background: #1e293b;
        }

        .item-card:hover, .item-card.active {
            border-color: #3b82f6;
            background: #3b82f6;
            color: #fff;
            transform: translateX(-3px);
        }

        .channel-card {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-card:hover, .channel-card.active {
            border-color: #3b82f6;
            background: #1e293b;
        }

        .channel-logo {
            width: 40px;
            height: 40px;
            background: #0f172a;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid #475569;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* بەشی شاشەی تەلەفزیۆن */
        .tv-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #090d16;
        }

        .player-wrapper {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 2px solid #334155;
        }

        .video-js {
            width: 100%;
            height: 100%;
        }

        .current-playing {
            margin-top: 15px;
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .loading, .error {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- بەشی شاشەی تەلەفزیۆن -->
    <div class="tv-container">
        <div class="player-wrapper">
            <video id="tvPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup='{}'></video>
        </div>
        <div class="current-playing" id="currentPlayingTitle">کەناڵێک هەڵبژێرە بۆ سەیرکردن</div>
    </div>

    <!-- ستونی کەناڵەکان -->
    <div class="channels-sidebar">
        <div class="sidebar-header">کەناڵەکان</div>
        <div class="sidebar-list" id="channelsList">
            <div class="loading">تکایە گرووپێک هەڵبژێرە...</div>
        </div>
    </div>

    <!-- ستونی گرووپەکان -->
    <div class="groups-sidebar">
        <div class="sidebar-header">گرووپەکان</div>
        <div class="sidebar-list" id="groupsList">
            <div class="loading">خەریکی بارکردنە...</div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        // بەکارهێنانی پرۆکسی بۆ تێپەڕاندنی کێشەی CORS بە ئاسانی
        const targetUrl = 'https://opop.pro/MSpHUvsRZLNkaC';
        const m3uUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
        
        let player = videojs('tvPlayer');
        let allGroups = {};

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error('شکست لە هێنانی لینکەکە');
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                document.getElementById('groupsList').innerHTML = `<div class="error">کێشە لە هێنانی داتاکەدا هەیە.</div>`;
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            allGroups = {};
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    // دۆزینەوەی لۆگۆ
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentChannel.logo = (logoMatch && logoMatch[1]) ? logoMatch[1] : 'https://via.placeholder.com/150?text=TV';
                    
                    // دۆزینەوەی گرووپ (category)
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = (groupMatch && groupMatch[1]) ? groupMatch[1] : 'گشتی';

                    // ناوی کەناڵ
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentChannel.name = line.substring(commaIndex + 1).trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name) {
                        if (!allGroups[currentChannel.group]) {
                            allGroups[currentChannel.group] = [];
                        }
                        allGroups[currentChannel.group].push(currentChannel);
                    }
                }
            }
            renderGroups();
        }

        function renderGroups() {
            const groupsContainer = document.getElementById('groupsList');
            groupsContainer.innerHTML = '';
            
            const groupNames = Object.keys(allGroups);
            if (groupNames.length === 0) {
                groupsContainer.innerHTML = `<div class="error">هیچ گرووپێک نەدۆزرایەوە.</div>`;
                return;
            }

            groupNames.forEach((groupName, index) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerText = groupName;

                if (index === 0) {
                    card.classList.add('active');
                    renderChannels(allGroups[groupName]);
                }

                card.addEventListener('click', () => {
                    document.querySelectorAll('#groupsList .item-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    renderChannels(allGroups[groupName]);
                });

                groupsContainer.appendChild(card);
            });
        }

        function renderChannels(channels) {
            const channelsContainer = document.getElementById('channelsList');
            channelsContainer.innerHTML = '';

            channels.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="channel-logo">
                        <img src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                    </div>
                    <div class="channel-name">${channel.name}</div>
                `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('#channelsList .channel-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');

                    document.getElementById('currentPlayingTitle').innerText = `پەخشکردن: ${channel.name}`;
                    player.src({ type: 'application/x-mpegURL', src: channel.url });
                    player.play();
                });

                channelsContainer.appendChild(card);
            });
        }

        loadPlaylist();
    </script>
</body>
</html>
